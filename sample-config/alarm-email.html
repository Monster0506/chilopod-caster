<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chilopod Alarm</title>
</head>
<body style="margin:0;padding:56px 24px;background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;">
    <tr>
      <td style="padding-bottom:18px;">
        <div style="font-size:13px;font-weight:600;color:{{ACCENT}};">{{TYPE_LABEL}}</div>
      </td>
    </tr>
    <tr>
      <td style="padding-bottom:20px;">
        <div style="font-size:30px;font-weight:700;line-height:1.25;color:#1a1a1a;">{{MOUNTPOINT}}</div>
      </td>
    </tr>
    <tr>
      <td style="padding-bottom:36px;">
        <div style="font-size:16px;line-height:1.65;color:#3f3f46;">{{SUMMARY}}</div>
      </td>
    </tr>
    <tr>
      <td>
        <div style="font-size:13px;color:#9a9a9f;">{{TIME}}</div>
      </td>
    </tr>
  </table>
</body>
</html>
